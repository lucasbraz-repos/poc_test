name: CI e deploy AWS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "909492399516"

jobs:
  validate:
    name: Python, contratos e Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint test
      - name: Pacote reproduzível e schema versionado
        run: |
          python tools/package_aws.py
          git diff --exit-code -- infra/terraform/catalog.json
      - name: Validar infraestrutura sem acesso à AWS
        run: |
          terraform fmt -check -recursive infra
          terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra/bootstrap validate

  spark:
    name: Integração PySpark no Glue 5
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Executar jobs e compatibilidade do SDK
        run: |
          docker run --rm --network none --memory 4g --cpus 2 \
            -v "$PWD:/workspace:ro" --workdir /workspace \
            -e SPARK_LOCAL_IP=127.0.0.1 --entrypoint /bin/bash \
            public.ecr.aws/glue/aws-glue-libs:5 \
            -lc 'export PYTHONPATH="/workspace:${PYTHONPATH}"; spark-submit --master local[2] tools/run_spark_tests.py --suite jobs && python3 -m unittest discover -s tests_aws -p test_sdk_compat.py -v'

  medallion:
    name: Validar Bronze, Silver e Gold
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar Bronze — sintaxe, imports e tabela em memória
        run: |
          docker run --rm --network none --memory 4g --cpus 2 \
            -v "$PWD:/workspace:ro" --workdir /workspace \
            -e SPARK_LOCAL_IP=127.0.0.1 --entrypoint /bin/bash \
            public.ecr.aws/glue/aws-glue-libs:5 \
            -lc 'export PYTHONPATH="/workspace:${PYTHONPATH}"; python3 -m unittest tests_aws.test_medallion_syntax.MedallionSyntaxTests.test_bronze -v && spark-submit --master local[2] tools/run_spark_tests.py --suite smoke --layer bronze'
      - name: Validar Silver — sintaxe, imports e tabela em memória
        run: |
          docker run --rm --network none --memory 4g --cpus 2 \
            -v "$PWD:/workspace:ro" --workdir /workspace \
            -e SPARK_LOCAL_IP=127.0.0.1 --entrypoint /bin/bash \
            public.ecr.aws/glue/aws-glue-libs:5 \
            -lc 'export PYTHONPATH="/workspace:${PYTHONPATH}"; python3 -m unittest tests_aws.test_medallion_syntax.MedallionSyntaxTests.test_silver -v && spark-submit --master local[2] tools/run_spark_tests.py --suite smoke --layer silver'
      - name: Validar Gold — sintaxe, imports e tabela em memória
        run: |
          docker run --rm --network none --memory 4g --cpus 2 \
            -v "$PWD:/workspace:ro" --workdir /workspace \
            -e SPARK_LOCAL_IP=127.0.0.1 --entrypoint /bin/bash \
            public.ecr.aws/glue/aws-glue-libs:5 \
            -lc 'export PYTHONPATH="/workspace:${PYTHONPATH}"; python3 -m unittest tests_aws.test_medallion_syntax.MedallionSyntaxTests.test_gold -v && spark-submit --master local[2] tools/run_spark_tests.py --suite smoke --layer gold'

  deploy:
    name: Publicar na AWS
    needs: [validate, spark, medallion]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Autenticar com OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::909492399516:role/github-poc-test-deploy
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-duration-seconds: 7200
      - name: Atualizar infraestrutura, jobs e views
        run: python tools/deploy_aws.py --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" --wait-idle-minutes 40
      - name: Arquivar código completo do commit e conferir release
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: python tools/release_aws.py --commit "$DEPLOY_COMMIT"
      - name: Guardar resultado sem estado ou plano Terraform
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ github.sha }}
          path: |
            build/aws/deployment.json
            build/aws/release.json
            build/aws/deploy-result.json
          retention-days: 14
          if-no-files-found: error
